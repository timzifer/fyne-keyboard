name: Linux build dependencies
description: Installs the OpenGL and X11 headers that Fyne's GLFW driver needs.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          gcc libgl1-mesa-dev libxi-dev libxcursor-dev libxrandr-dev \
          libxinerama-dev libxkbcommon-dev xorg-dev
